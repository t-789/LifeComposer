<!DOCTYPE html>
<html lang="zh-CN" style="background-color: #0F0A2E;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知途 · 登录 / 注册</title>
    <!-- 视觉稿来自团队的 zhitu-auth；此处只复用页面设计，认证接入主项目 Session/CSRF。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --c-bg: #0F0A2E;
            --c-violet: #7C3AED;
            --c-fuchsia: #D946EF;
            --c-amber: #FBBF24;
            --c-cyan: #06B6D4;
            --c-pink: #EC4899;
            --text-main: #F1F0FF;
            --text-dim: #9D96C9;
        }

        html, body { min-height: 100%; }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--c-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
        }

        /* ===== 背景光斑 ===== */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.5;
            pointer-events: none;
            z-index: 0;
            will-change: transform;
        }
        .orb-1 {
            width: 520px; height: 520px;
            background: var(--c-fuchsia);
            top: -140px; left: -120px;
            animation: drift1 16s ease-in-out infinite;
        }
        .orb-2 {
            width: 440px; height: 440px;
            background: var(--c-cyan);
            bottom: -100px; right: -80px;
            animation: drift2 20s ease-in-out infinite;
        }
        .orb-3 {
            width: 360px; height: 360px;
            background: var(--c-amber);
            top: 35%; left: 55%;
            opacity: 0.25;
            animation: drift3 24s ease-in-out infinite;
        }
        @keyframes drift1 {
            0%, 100% { transform: translate3d(0,0,0) scale(1); }
            50% { transform: translate3d(90px, 70px, 0) scale(1.12); }
        }
        @keyframes drift2 {
            0%, 100% { transform: translate3d(0,0,0) scale(1); }
            50% { transform: translate3d(-110px, -90px, 0) scale(1.18); }
        }
        @keyframes drift3 {
            0%, 100% { transform: translate3d(0,0,0) scale(1); }
            50% { transform: translate3d(-70px, -130px, 0) scale(0.88); }
        }

        .grid-overlay {
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 52px 52px;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: fixed;
            border-radius: 50%;
            background: rgba(255,255,255,0.35);
            pointer-events: none;
            z-index: 0;
            will-change: transform, opacity;
            animation: rise linear infinite;
        }
        @keyframes rise {
            0% { transform: translate3d(0, 100vh, 0) scale(0); opacity: 0; }
            10% { opacity: 1; transform: translate3d(0, 90vh, 0) scale(1); }
            90% { opacity: 0.4; }
            100% { transform: translate3d(0, -10vh, 0) scale(0.4); opacity: 0; }
        }

        .side-label {
            position: fixed;
            left: 28px; top: 50%;
            transform: translateY(-50%) rotate(180deg);
            writing-mode: vertical-rl;
            font-family: 'ZCOOL KuaiLe', sans-serif;
            font-size: 14px;
            letter-spacing: 8px;
            color: rgba(255,255,255,0.12);
            z-index: 0;
            pointer-events: none;
            user-select: none;
        }
        .side-label-right {
            left: auto; right: 28px;
            transform: translateY(-50%);
            color: rgba(217,70,239,0.18);
        }

        /* ===== 舞台入场 ===== */
        .stage {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
            animation: stageIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
            will-change: transform, opacity;
        }
        @media (max-width: 520px) {
            .panel { padding-left: 22px; padding-right: 22px; }
            .brand { padding-left: 22px; padding-right: 22px; }
            .side-label { display: none; }
        }
        @keyframes stageIn {
            from { opacity: 0; transform: translate3d(0, 30px, 0) scale(0.96); }
            to   { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
        }

        /* ===== 玻璃卡片 ===== */
        .card {
            position: relative;
            background: rgba(255, 255, 255, 0.055);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 5px;
            background: linear-gradient(180deg, var(--c-fuchsia), var(--c-violet), var(--c-cyan));
            transition: opacity 0.5s;
            z-index: 2;
        }
        .card.to-register::before {
            background: linear-gradient(180deg, var(--c-cyan), var(--c-violet), var(--c-amber));
        }

        /* ===== 品牌区（共享顶部） ===== */
        .brand {
            padding: 36px 38px 0;
            position: relative;
        }
        .brand-top {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 14px;
        }
        .brand-logo {
            flex-shrink: 0;
            width: 56px; height: 56px;
            display: flex; align-items: center; justify-content: center;
            font-family: 'ZCOOL KuaiLe', sans-serif;
            font-size: 28px; color: #fff;
            background: linear-gradient(135deg, var(--c-violet), var(--c-fuchsia));
            border-radius: 16px;
            position: relative;
            transition: background 0.5s;
        }
        .card.to-register .brand-logo {
            background: linear-gradient(135deg, var(--c-cyan), var(--c-violet));
        }
        .brand-logo::after {
            content: '';
            position: absolute; inset: -3px;
            border-radius: 18px;
            background: inherit;
            filter: blur(12px);
            opacity: 0.4;
            z-index: -1;
            animation: glow 3.5s ease-in-out infinite;
        }
        @keyframes glow {
            0%, 100% { opacity: 0.25; }
            50% { opacity: 0.55; }
        }
        .brand-text h1 {
            font-family: 'ZCOOL KuaiLe', sans-serif;
            font-size: 32px;
            font-weight: 400;
            line-height: 1.1;
            background: linear-gradient(135deg, #fff 0%, var(--c-fuchsia) 60%, var(--c-amber) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 3px;
            transition: background 0.5s;
        }
        .card.to-register .brand-text h1 {
            background: linear-gradient(135deg, #fff 0%, var(--c-cyan) 60%, var(--c-amber) 100%);
            -webkit-background-clip: text;
            background-clip: text;
        }
        .brand-text .tag {
            display: inline-block;
            margin-top: 5px;
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: 2px;
            padding: 3px 10px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px;
        }
        .brand-desc {
            font-size: 13px;
            color: var(--text-dim);
            line-height: 1.6;
            border-left: 2px solid var(--c-fuchsia);
            padding-left: 14px;
            margin-bottom: 8px;
            transition: border-color 0.5s;
        }
        .card.to-register .brand-desc {
            border-left-color: var(--c-cyan);
        }

        /* ===== 滑动面板容器 ===== */
        .viewport {
            overflow: hidden;
            position: relative;
            height: 380px;
            transition: height 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .card.to-register .viewport {
            height: 680px;
        }
        .panels {
            display: flex;
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
        }
        .panel {
            flex: 0 0 100%;
            width: 100%;
            padding: 20px 38px 34px;
        }

        /* ===== 表单 ===== */
        .form-group { margin-bottom: 20px; position: relative; }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: rgba(255,255,255,0.55);
            margin-bottom: 6px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-wrapper input {
            width: 100%; height: 44px;
            padding: 0 40px 0 2px;
            border: none;
            border-bottom: 2px solid rgba(255,255,255,0.15);
            border-radius: 0;
            font-size: 15px; color: var(--text-main);
            outline: none;
            background: transparent;
            transition: border-color 0.3s;
        }
        .input-wrapper input::placeholder { color: rgba(255,255,255,0.25); }
        .input-wrapper::after {
            content: '';
            position: absolute;
            left: 0; bottom: -2px;
            width: 100%; height: 2px;
            background: linear-gradient(90deg, var(--c-fuchsia), var(--c-amber));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .card.to-register .input-wrapper::after {
            background: linear-gradient(90deg, var(--c-cyan), var(--c-violet));
        }
        .input-wrapper:focus-within::after { transform: scaleX(1); }
        .input-wrapper input.invalid { border-bottom-color: #F87171; }
        .input-wrapper input.valid { border-bottom-color: #34D399; }

        .toggle-password {
            position: absolute; right: 0;
            width: 36px; height: 36px;
            border: none; background: transparent;
            cursor: pointer; color: var(--text-dim);
            font-size: 12px; font-weight: 600;
            transition: color 0.2s;
        }
        .toggle-password:hover { color: var(--c-fuchsia); }

        .error-msg {
            font-size: 12px; color: #FCA5A5;
            margin-top: 5px; min-height: 15px;
        }

        .password-strength {
            font-size: 12px; margin-top: 6px;
            display: flex; align-items: center; gap: 8px;
        }
        .strength-bar {
            flex: 1; height: 4px;
            background: rgba(255,255,255,0.08);
            border-radius: 2px; overflow: hidden;
        }
        .strength-bar > span {
            display: block; height: 100%;
            border-radius: 2px;
            transition: width 0.3s, background 0.3s;
        }
        .strength-text.weak { color: #F87171; }
        .strength-text.medium { color: var(--c-amber); }
        .strength-text.strong { color: #34D399; }

        .global-error {
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.25);
            border-left: 3px solid #F87171;
            color: #FCA5A5;
            border-radius: 0 10px 10px 0;
            padding: 10px 14px; font-size: 13px;
            margin-bottom: 14px; display: none;
        }
        .success-toast {
            background: rgba(52, 211, 153, 0.1);
            border: 1px solid rgba(52, 211, 153, 0.25);
            border-left: 3px solid #34D399;
            color: #6EE7B7;
            border-radius: 0 10px 10px 0;
            padding: 10px 14px; font-size: 13px;
            margin-bottom: 14px; display: none;
        }

        /* ===== 按钮 ===== */
        .btn-submit {
            position: relative;
            width: 100%; height: 50px;
            border: none;
            color: #fff; font-size: 16px; font-weight: 700;
            font-family: 'Noto Sans SC', sans-serif;
            cursor: pointer; letter-spacing: 8px; text-indent: 8px;
            clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
            background: linear-gradient(135deg, var(--c-violet), var(--c-fuchsia), var(--c-pink));
            background-size: 200% 200%;
            transition: background-position 0.4s, transform 0.15s;
            overflow: hidden;
        }
        .card.to-register .btn-submit {
            clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 100%, 8px 100%);
            background: linear-gradient(135deg, var(--c-cyan), var(--c-violet), var(--c-fuchsia));
        }
        .btn-submit::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }
        .btn-submit:hover { background-position: 100% 50%; }
        .btn-submit:hover::before { left: 100%; }
        .btn-submit:active { transform: scale(0.98); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-submit .spinner {
            display: inline-block; width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: #fff; border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle; margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== 底部切换链接 ===== */
        .toggle-row {
            text-align: center;
            margin-top: 22px;
            font-size: 13px; color: var(--text-dim);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .toggle-row .line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
        }
        .toggle-btn {
            background: none; border: none;
            color: var(--c-fuchsia);
            font-size: 13px; font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            font-family: inherit;
            transition: color 0.2s;
            white-space: nowrap;
        }
        .card.to-register .toggle-btn { color: var(--c-cyan); }
        .toggle-btn:hover { color: #F0ABFC; }
        .card.to-register .toggle-btn:hover { color: #67E8F9; }

        @media (max-width: 480px) {
            .brand { padding: 28px 24px 0; }
            .panel { padding: 16px 24px 26px; }
            .brand-text h1 { font-size: 26px; }
            .brand-logo { width: 48px; height: 48px; font-size: 24px; }
            .side-label { display: none; }
        }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-overlay"></div>
    <div class="side-label">ZHITU · 知途</div>
    <div class="side-label side-label-right">CROSS-DISCIPLINARY PATH</div>

    <div class="stage">
        <div class="card" id="card">
            <!-- 共享品牌区 -->
            <div class="brand">
                <div class="brand-top">
                    <div class="brand-logo">知</div>
                    <div class="brand-text">
                        <h1>知途</h1>
                        <span class="tag" id="brandTag">GROWTH · PATH</span>
                    </div>
                </div>
                <p class="brand-desc" id="brandDesc">基于能力画像的大学生跨学科成长路径规划智能体</p>
            </div>

            <!-- 滑动面板 -->
            <div class="viewport">
                <div class="panels" id="panels">

                    <!-- 登录面板 -->
                    <div class="panel" id="panelLogin">
                        <div class="success-toast" id="successToast"></div>
                        <div class="global-error" id="loginError"></div>

                        <form id="loginForm" novalidate>
                            <div class="form-group">
                                <label for="account">账号 / Account</label>
                                <div class="input-wrapper">
                                    <input type="text" id="account" name="account"
                                           autocomplete="username" placeholder="学号、邮箱或用户名"
                                           maxlength="100">
                                </div>
                                <div class="error-msg" id="accountError"></div>
                            </div>

                            <div class="form-group">
                                <label for="password">密码 / Password</label>
                                <div class="input-wrapper">
                                    <input type="password" id="password" name="password"
                                           autocomplete="current-password" placeholder="请输入密码"
                                           maxlength="50">
                                    <button type="button" class="toggle-password" id="togglePwd" aria-label="切换密码可见">显示</button>
                                </div>
                                <div class="error-msg" id="passwordError"></div>
                            </div>

                            <button type="submit" class="btn-submit" id="loginBtn">登 录</button>
                        </form>

                        <div class="toggle-row">
                            <div class="line"></div>
                            <button type="button" class="toggle-btn" data-switch="register">立即注册 →</button>
                            <div class="line"></div>
                        </div>
                    </div>

                    <!-- 注册面板 -->
                    <div class="panel" id="panelRegister">
                        <div class="global-error" id="registerError"></div>

                        <form id="registerForm" novalidate>
                            <div class="form-group">
                                <label for="studentId">学号 / Student ID</label>
                                <div class="input-wrapper">
                                    <input type="text" id="studentId" name="studentId"
                                           autocomplete="username" placeholder="4-20位字母或数字"
                                           maxlength="20">
                                </div>
                                <div class="error-msg" id="studentIdError"></div>
                            </div>

                            <div class="form-group">
                                <label for="realName">姓名 / Name</label>
                                <div class="input-wrapper">
                                    <input type="text" id="realName" name="realName"
                                           autocomplete="name" placeholder="真实姓名"
                                           maxlength="50">
                                </div>
                                <div class="error-msg" id="realNameError"></div>
                            </div>

                            <div class="form-group">
                                <label for="email">邮箱 / Email</label>
                                <div class="input-wrapper">
                                    <input type="email" id="email" name="email"
                                           autocomplete="email" placeholder="常用邮箱"
                                           maxlength="50">
                                </div>
                                <div class="error-msg" id="emailError"></div>
                            </div>

                            <div class="form-group">
                                <label for="regPassword">密码 / Password</label>
                                <div class="input-wrapper">
                                    <input type="password" id="regPassword" name="regPassword"
                                           autocomplete="new-password" placeholder="至少8位，含字母和数字"
                                           maxlength="50">
                                </div>
                                <div class="error-msg" id="regPasswordError"></div>
                                <div class="password-strength">
                                    <div class="strength-bar"><span id="strengthBar"></span></div>
                                    <span id="strengthText" class="strength-text">请输入密码</span>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="confirmPassword">确认密码 / Confirm</label>
                                <div class="input-wrapper">
                                    <input type="password" id="confirmPassword" name="confirmPassword"
                                           autocomplete="new-password" placeholder="再次输入密码"
                                           maxlength="50">
                                </div>
                                <div class="error-msg" id="confirmPasswordError"></div>
                            </div>

                            <button type="submit" class="btn-submit" id="registerBtn">注 册</button>
                        </form>

                        <div class="toggle-row">
                            <div class="line"></div>
                            <button type="button" class="toggle-btn" data-switch="login">← 返回登录</button>
                            <div class="line"></div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="/csrf.js"></script>
    <script>
        // ===== 粒子背景 =====
        (function() {
            for (let i = 0; i < 15; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.animationDuration = (10 + Math.random() * 14) + 's';
                p.style.animationDelay = Math.random() * 12 + 's';
                const s = 2 + Math.random() * 3;
                p.style.width = p.style.height = s + 'px';
                document.body.appendChild(p);
            }
        })();

        // ===== 面板切换（无页面跳转，纯 CSS transform） =====
        const panels = document.getElementById('panels');
        const card = document.getElementById('card');
        const brandTag = document.getElementById('brandTag');
        const brandDesc = document.getElementById('brandDesc');
        const viewport = document.querySelector('.viewport');
        const panelLogin = document.getElementById('panelLogin');
        const panelRegister = document.getElementById('panelRegister');

        function switchPanel(target, updateUrl = true) {
            if (target === 'register') {
                panels.style.transform = 'translateX(-100%)';
                card.classList.add('to-register');
                brandTag.textContent = 'NEW · START';
                brandDesc.textContent = '开启你的跨学科成长路径';
            } else {
                panels.style.transform = 'translateX(0)';
                card.classList.remove('to-register');
                brandTag.textContent = 'GROWTH · PATH';
                brandDesc.textContent = '基于能力画像的大学生跨学科成长路径规划智能体';
            }
            if (updateUrl) history.pushState(null, '', target === 'register' ? '/front/register' : '/front/login');
        }

        document.querySelectorAll('.toggle-btn').forEach(btn => {
            btn.addEventListener('click', () => switchPanel(btn.dataset.switch));
        });

        // Both URLs share the original sliding design; browser back keeps the visible panel in sync.
        if (window.location.pathname === '/front/register') switchPanel('register', false);
        window.addEventListener('popstate', () => switchPanel(
            window.location.pathname === '/front/register' ? 'register' : 'login', false));
        // 注册成功后带 registered=true 参数跳转回来，默认显示登录
        const params = new URLSearchParams(window.location.search);
        if (params.get('registered') === 'true') {
            document.getElementById('successToast').textContent = '注册成功，请登录';
            document.getElementById('successToast').style.display = 'block';
        } else if (params.get('logout')) {
            document.getElementById('successToast').textContent = '您已成功登出';
            document.getElementById('successToast').style.display = 'block';
        } else if (params.get('expired')) {
            document.getElementById('loginError').textContent = '登录状态已失效，请重新登录';
            document.getElementById('loginError').style.display = 'block';
        }

        const $ = id => document.getElementById(id);

        // ===== 登录逻辑 =====
        const accountEl = $('account'), pwdEl = $('password');
        const accountErr = $('accountError'), pwdErr = $('passwordError');
        const loginErr = $('loginError'), successToast = $('successToast');
        const loginBtn = $('loginBtn'), loginForm = $('loginForm');

        $('togglePwd').addEventListener('click', () => {
            const show = pwdEl.type === 'password';
            pwdEl.type = show ? 'text' : 'password';
            $('togglePwd').textContent = show ? '隐藏' : '显示';
        });

        function validateAccount() {
            if (!accountEl.value.trim()) {
                accountErr.textContent = '请输入账号';
                accountEl.classList.add('invalid');
                return false;
            }
            accountErr.textContent = '';
            accountEl.classList.remove('invalid');
            return true;
        }
        function validatePassword() {
            if (!pwdEl.value) {
                pwdErr.textContent = '请输入密码';
                pwdEl.classList.add('invalid');
                return false;
            }
            pwdErr.textContent = '';
            pwdEl.classList.remove('invalid');
            return true;
        }
        accountEl.addEventListener('blur', validateAccount);
        accountEl.addEventListener('input', () => { if (accountErr.textContent) validateAccount(); });
        pwdEl.addEventListener('blur', validatePassword);
        pwdEl.addEventListener('input', () => { if (pwdErr.textContent) validatePassword(); });

        loginForm.addEventListener('submit', async e => {
            e.preventDefault();
            loginErr.style.display = 'none';
            const okA = validateAccount(), okP = validatePassword();
            if (!okA || !okP) return;

            loginBtn.disabled = true;
            loginBtn.textContent = '登录中...';

            try {
                const res = await fetch('/api/users/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username: accountEl.value.trim(), password: pwdEl.value })
                });
                const data = await res.json().catch(() => ({}));
                if (res.ok) {
                    if (data.passwordChangeRequired) {
                        window.location.assign('/front/change-password');
                        return;
                    }
                    successToast.textContent = '登录成功，正在跳转...';
                    successToast.style.display = 'block';
                    window.location.assign(data.type === 2 ? '/admin' : '/front/profile');
                } else {
                    loginErr.textContent = data.message || '登录失败，请重试';
                    loginErr.style.display = 'block';
                    successToast.style.display = 'none';
                }
            } catch (err) {
                loginErr.textContent = '网络异常，请稍后再试';
                loginErr.style.display = 'block';
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = '登 录';
            }
        });

        // ===== 注册逻辑 =====
        const fields = ['studentId','realName','email','regPassword','confirmPassword'];
        const errors = {};
        fields.forEach(f => errors[f] = $(f+'Error'));

        const studentIdEl = $('studentId'), realNameEl = $('realName');
        const emailEl = $('email'), regPwdEl = $('regPassword'), confirmEl = $('confirmPassword');
        const regBtn = $('registerBtn'), regForm = $('registerForm');
        const strengthBar = $('strengthBar'), strengthText = $('strengthText');
        const regErr = $('registerError');

        function setValid(input, valid) {
            input.classList.toggle('valid', valid);
            input.classList.toggle('invalid', !valid && input.value);
        }
        function showError(field, msg) { errors[field].textContent = msg; }

        function validateStudentId() {
            const v = studentIdEl.value.trim();
            if (!v) { showError('studentId', '请输入学号'); setValid(studentIdEl, false); return false; }
            if (v.length < 4 || v.length > 20) { showError('studentId', '学号长度应为4-20位'); setValid(studentIdEl, false); return false; }
            if (!/^[0-9A-Za-z]+$/.test(v)) { showError('studentId', '学号只能包含字母和数字'); setValid(studentIdEl, false); return false; }
            showError('studentId', ''); setValid(studentIdEl, true); return true;
        }
        function validateRealName() {
            const v = realNameEl.value.trim();
            if (!v) { showError('realName', '请输入姓名'); setValid(realNameEl, false); return false; }
            if (v.length < 2 || v.length > 50) { showError('realName', '姓名长度应为2-50字符'); setValid(realNameEl, false); return false; }
            showError('realName', ''); setValid(realNameEl, true); return true;
        }
        function validateEmail() {
            const v = emailEl.value.trim();
            if (!v) { showError('email', '请输入邮箱'); setValid(emailEl, false); return false; }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { showError('email', '邮箱格式不正确'); setValid(emailEl, false); return false; }
            showError('email', ''); setValid(emailEl, true); return true;
        }
        function calcStrength(pwd) {
            if (!pwd) return { label: '请输入密码', cls: '', width: '0', color: 'transparent' };
            let score = 0;
            if (pwd.length >= 8) score++;
            if (/[A-Z]/.test(pwd)) score++;
            if (/[a-z]/.test(pwd)) score++;
            if (/\d/.test(pwd)) score++;
            if (/[^A-Za-z0-9]/.test(pwd)) score++;
            if (pwd.length >= 12) score++;
            if (score <= 2) return { label: '弱', cls: 'weak', width: '33%', color: '#F87171' };
            if (score <= 4) return { label: '中', cls: 'medium', width: '66%', color: '#FBBF24' };
            return { label: '强', cls: 'strong', width: '100%', color: '#34D399' };
        }
        function updateStrength() {
            const s = calcStrength(regPwdEl.value);
            strengthBar.style.width = s.width;
            strengthBar.style.background = s.color;
            strengthText.textContent = s.label;
            strengthText.className = 'strength-text ' + s.cls;
        }
        function validateRegPassword() {
            const v = regPwdEl.value;
            if (!v) { showError('regPassword', '请输入密码'); setValid(regPwdEl, false); return false; }
            if (v.length < 8) { showError('regPassword', '密码至少8位'); setValid(regPwdEl, false); return false; }
            if (!/[A-Za-z]/.test(v) || !/\d/.test(v)) { showError('regPassword', '密码必须包含字母和数字'); setValid(regPwdEl, false); return false; }
            showError('regPassword', ''); setValid(regPwdEl, true);
            if (confirmEl.value) validateConfirm();
            return true;
        }
        function validateConfirm() {
            const v = confirmEl.value;
            if (!v) { showError('confirmPassword', '请再次输入密码'); setValid(confirmEl, false); return false; }
            if (v !== regPwdEl.value) { showError('confirmPassword', '两次密码不一致'); setValid(confirmEl, false); return false; }
            showError('confirmPassword', ''); setValid(confirmEl, true); return true;
        }

        studentIdEl.addEventListener('blur', validateStudentId);
        realNameEl.addEventListener('blur', validateRealName);
        emailEl.addEventListener('blur', validateEmail);
        regPwdEl.addEventListener('input', updateStrength);
        regPwdEl.addEventListener('blur', validateRegPassword);
        confirmEl.addEventListener('blur', validateConfirm);

        regForm.addEventListener('submit', async e => {
            e.preventDefault();
            regErr.style.display = 'none';
            const results = [validateStudentId(), validateRealName(), validateEmail(), validateRegPassword(), validateConfirm()];
            if (!results.every(Boolean)) return;

            regBtn.disabled = true;
            regBtn.textContent = '注册中...';

            try {
                const res = await fetch('/api/users/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        username: studentIdEl.value.trim(),
                        realName: realNameEl.value.trim(),
                        email: emailEl.value.trim(),
                        password: regPwdEl.value
                    })
                });
                if (res.ok) {
                    // 注册成功：滑回登录面板并显示成功提示
                    switchPanel('login');
                    accountEl.value = studentIdEl.value.trim();
                    regForm.reset();
                    successToast.textContent = '注册成功，请登录';
                    successToast.style.display = 'block';
                } else {
                    const body = await res.text();
                    let error;
                    try { error = JSON.parse(body); } catch (ignored) { error = body; }
                    regErr.textContent = (typeof error === 'object'
                        ? (error.email || error.username || error.password || error.realName || error.message) : error)
                        || '注册失败，请重试';
                    regErr.style.display = 'block';
                }
            } catch (err) {
                regErr.textContent = '网络异常，请稍后再试';
                regErr.style.display = 'block';
            } finally {
                regBtn.disabled = false;
                regBtn.textContent = '注 册';
            }
        });
    </script>
</body>
</html>
