<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 对话测试</title>
    <!-- Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <!-- XSS sanitization -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <!-- Math formula rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <style>
        :root {
            /* 大屏下内容列（消息/输入框）的最大宽度；浏览器更窄时完全跟随窗口宽度 */
            --content-max: 1000px;
            /* 窄屏时的左右安全边距 */
            --page-pad: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            font-family: -apple-system, system-ui, sans-serif;
            background: #ededed;
        }

        .chat-container {
            /* 外壳铺满浏览器宽度：窄屏满宽，宽屏也不再用固定 500px 手机宽度 */
            width: 100%;
            max-width: 100%;
            height: 100vh;
            height: 100dvh; /* 移动端浏览器地址栏收起/展开时高度自适应 */
            display: flex;
            flex-direction: column;
            background: #ededed;
        }

        .chat-header {
            background: #2E7D32;
            color: white;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: 500;
            flex-shrink: 0;
        }

        .clear-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.5);
            color: white;
            border-radius: 4px;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 12px;
        }

        .clear-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            scroll-behavior: smooth;
        }

        .message {
            /* 跟随窗口缩放，同时限制超宽屏下的行长，避免一行文字过长 */
            max-width: min(75%, 720px);
            padding: 8px 12px;
            margin-bottom: 10px;
            word-break: break-word;
            line-height: 1.5;
            font-size: 15px;
        }

        .message.user {
            background: #95EC69;
            color: #000;
            margin-left: auto;
            border-radius: 12px 4px 12px 12px;
            white-space: pre-wrap;
        }

        .message.assistant {
            background: #FFFFFF;
            color: #333;
            margin-right: auto;
            border-radius: 4px 12px 12px 12px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.08);
        }

        /* Markdown rendering styles for assistant messages */
        .message.assistant p { margin: 0 0 8px; }
        .message.assistant p:last-child { margin-bottom: 0; }
        .message.assistant h1, .message.assistant h2, .message.assistant h3 { margin: 8px 0 4px; }
        .message.assistant h1 { font-size: 1.3em; }
        .message.assistant h2 { font-size: 1.15em; }
        .message.assistant h3 { font-size: 1.05em; }
        .message.assistant ul, .message.assistant ol { padding-left: 20px; margin: 4px 0; }
        .message.assistant li { margin: 2px 0; }
        .message.assistant pre { background: #f5f5f5; padding: 8px 12px; border-radius: 6px; overflow-x: auto; margin: 6px 0; }
        .message.assistant code { font-family: 'SF Mono', Monaco, Consolas, monospace; font-size: 0.9em; }
        .message.assistant :not(pre) > code { background: #f0f0f0; padding: 1px 4px; border-radius: 3px; }
        .message.assistant table { border-collapse: collapse; margin: 6px 0; font-size: 0.9em; }
        .message.assistant th, .message.assistant td { border: 1px solid #ddd; padding: 4px 8px; }
        .message.assistant th { background: #f5f5f5; }
        .message.assistant blockquote { border-left: 3px solid #ccc; padding-left: 10px; margin: 6px 0; color: #666; }
        .message.assistant .katex-display { margin: 8px 0; overflow-x: auto; overflow-y: hidden; }
        .message.assistant hr { border: none; border-top: 1px solid #ddd; margin: 8px 0; }

        .message.system {
            background: #FFF3E0;
            color: #E65100;
            margin: 0 auto 10px;
            text-align: center;
            font-size: 13px;
            border-radius: 8px;
            max-width: 90%;
        }

        .message.error {
            background: #FFCDD2;
            color: #C62828;
            margin-right: auto;
            border-radius: 4px 12px 12px 12px;
        }

        .chat-input-bar {
            background: #F8F8F8;
            padding: 8px 12px 12px;
            display: flex;
            gap: 8px;
            align-items: flex-end;
            border-top: 1px solid #E0E0E0;
            flex-shrink: 0;
        }

        /* 三段式对齐：外壳（绿色标题栏/消息区/输入栏）铺满宽度，
           内容列在宽屏居中并限制阅读宽度，窄屏自动退化为满宽 + 安全边距。
           max() 中百分比按各自包含块（.chat-container）计算，三栏左边缘始终对齐。 */
        .chat-header,
        .chat-messages,
        .chat-input-bar {
            padding-left: max(var(--page-pad), calc((100% - var(--content-max)) / 2));
            padding-right: max(var(--page-pad), calc((100% - var(--content-max)) / 2));
        }

        textarea {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            font-family: inherit;
            font-size: 15px;
            padding: 8px 12px;
            border-radius: 20px;
            background: white;
            max-height: 120px;
            line-height: 1.4;
        }

        textarea:focus {
            box-shadow: 0 0 0 2px rgba(46,125,50,0.2);
        }

        .send-btn {
            background: #2E7D32;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 20px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
        }

        .send-btn:disabled {
            background: #A5D6A7;
            cursor: not-allowed;
        }

        .send-btn:hover:not(:disabled) {
            background: #1B5E20;
        }

        .loading-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
        }

        .loading-dot {
            width: 8px;
            height: 8px;
            background: #CCC;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .loading-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .message-time {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
            text-align: inherit;
        }

        .process-box {
            width: 100%;
            max-width: 92%;
            margin: 0 auto 8px;
        }

        .process-line {
            font-size: 12px;
            color: #555;
            background: rgba(255,255,255,0.75);
            border: 1px dashed #cfcfcf;
            border-radius: 8px;
            padding: 4px 8px;
            margin-bottom: 4px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .process-line.thinking { color: #1565C0; }
        .process-line.tool { color: #6A1B9A; }
        .process-line.error { color: #C62828; }

        /* 窄屏（手机）适配：收紧边距，气泡占更宽比例 */
        @media (max-width: 480px) {
            :root {
                --page-pad: 12px;
            }

            .chat-messages {
                padding-top: 10px;
                padding-bottom: 10px;
            }

            .message {
                max-width: 85%;
            }

            .send-btn {
                padding: 8px 14px;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <span>AI 对话测试</span>
            <button class="clear-btn" onclick="clearContext()">清除上下文</button>
        </div>
        <div class="chat-messages" id="messageArea">
        </div>
        <div class="chat-input-bar">
            <textarea id="messageInput" rows="1" placeholder="输入消息..."
                      onkeydown="onInputKeydown(event)" oninput="autoResize(this)"></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
    </div>
    <script src="/csrf.js"></script>
    <script>
        // Markdown + KaTeX rendering pipeline
        function renderAssistantMessage(text) {
            if (!text) return "";

            var replacements = [];
            var counter = 0;
            var makeToken = function() { return "__MATH_" + (counter++) + "__"; };

            var processed = text;

            processed = processed.replace(/\$\$([\s\S]*?)\$\$/g, function(full, inner) {
                var token = makeToken();
                replacements.push({ token: token, html: renderKaTeX(inner.trim(), true) });
                return "\n\n" + token + "\n\n";
            });

            processed = processed.replace(/\\\[([\s\S]*?)\\\]/g, function(full, inner) {
                var token = makeToken();
                replacements.push({ token: token, html: renderKaTeX(inner.trim(), true) });
                return "\n\n" + token + "\n\n";
            });

            processed = processed.replace(/\$([^$\n]+?)\$/g, function(full, inner) {
                var token = makeToken();
                replacements.push({ token: token, html: renderKaTeX(inner.trim(), false) });
                return token;
            });

            processed = processed.replace(/\\\(([^\n]+?)\\\)/g, function(full, inner) {
                var token = makeToken();
                replacements.push({ token: token, html: renderKaTeX(inner.trim(), false) });
                return token;
            });

            var html;
            if (typeof marked !== "undefined") {
                html = marked.parse(processed);
            } else {
                html = processed.replace(/\n/g, "<br>");
            }

            if (typeof DOMPurify !== "undefined") {
                html = DOMPurify.sanitize(html, {
                    USE_PROFILES: { html: true, mathMl: true, svg: false }
                });
            }

            for (var i = 0; i < replacements.length; i++) {
                html = html.replaceAll(replacements[i].token, replacements[i].html);
            }

            return html;
        }

        function renderKaTeX(expr, displayMode) {
            if (typeof katex !== "undefined" && typeof katex.renderToString === "function") {
                try {
                    return katex.renderToString(expr, {
                        displayMode: displayMode,
                        throwOnError: false
                    });
                } catch (e) {
                    return "<code>" + escapeHtml(expr) + "</code>";
                }
            }
            return displayMode ? "<pre>" + escapeHtml(expr) + "</pre>" : "<code>" + escapeHtml(expr) + "</code>";
        }

        function escapeHtml(str) {
            var div = document.createElement("div");
            div.textContent = str == null ? "" : str;
            return div.innerHTML;
        }

        // ---- SSE turn state ----
        var thinkingTimer = null;
        var thinkingSeconds = 0;
        var thinkingLine = null;
        var currentProcessBox = null;
        var currentAssistantEl = null;
        var currentAssistantText = "";

        window.onload = function() {
            loadHistory();
        };

        async function loadHistory() {
            try {
                const response = await fetch("/api/chat/history", { credentials: "include" });
                if (response.ok) {
                    const messages = await response.json();
                    for (const msg of messages) {
                        if (msg.role === "tool") continue;
                        if (msg.role === "assistant" && isToolCallPayload(msg.content)) continue;
                        appendMessage(msg.role, msg.content);
                    }
                }
                scrollToBottom();
            } catch (e) {
                console.error("Failed to load history:", e);
            }
        }

        function isToolCallPayload(content) {
            if (!content) return false;
            try {
                const obj = JSON.parse(content);
                return obj && obj.type === "tool_call";
            } catch (e) {
                return false;
            }
        }

        async function sendMessage() {
            const input = document.getElementById("messageInput");
            const text = input.value.trim();
            if (!text) return;

            input.value = "";
            autoResize(input);
            appendMessage("user", text);

            const sendBtn = document.getElementById("sendBtn");
            sendBtn.disabled = true;
            resetTurnState();

            try {
                const response = await fetch("/api/chat/stream", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Accept": "text/event-stream" },
                    credentials: "include",
                    body: JSON.stringify({ message: text })
                });

                if (!response.ok) {
                    let errorText = "请求失败，请重试";
                    try {
                        const errorData = await response.json();
                        errorText = errorData.message || errorData.error || errorText;
                    } catch (ignored) { }
                    appendMessage("error", errorText);
                    return;
                }
                if (!response.body) {
                    appendMessage("error", "浏览器不支持流式响应");
                    return;
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let buffer = "";
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    let separatorIndex;
                    while ((separatorIndex = buffer.indexOf("\n\n")) >= 0) {
                        const rawEvent = buffer.slice(0, separatorIndex);
                        buffer = buffer.slice(separatorIndex + 2);
                        handleSseEvent(rawEvent);
                    }
                }
                if (buffer.trim()) handleSseEvent(buffer);
            } catch (e) {
                stopThinking();
                appendMessage("error", "网络错误，请检查连接后重试");
            } finally {
                stopThinking();
                sendBtn.disabled = false;
                scrollToBottom();
            }
        }

        function handleSseEvent(rawEvent) {
            const lines = rawEvent.split("\n");
            let eventName = "message";
            const dataLines = [];
            for (const line of lines) {
                if (line.startsWith("event:")) {
                    eventName = line.slice(6).trim();
                } else if (line.startsWith("data:")) {
                    dataLines.push(line.slice(5).trim());
                }
            }
            let data = {};
            if (dataLines.length) {
                const payload = dataLines.join("\n");
                try {
                    data = JSON.parse(payload);
                } catch (e) {
                    data = { raw: payload };
                }
            }

            switch (eventName) {
                case "thinking_start":
                    startThinking();
                    break;
                case "thinking_tick":
                    updateThinking(data.elapsedSeconds);
                    break;
                case "thinking_end":
                    stopThinking(data.elapsedMs);
                    break;
                case "tool_call":
                    appendProcessLine("tool", "tool call - " + (data.description || data.name || ""));
                    break;
                case "tool_result":
                    appendProcessLine("tool", "tool result - " + (data.name || "") + (data.ok ? " ✓" : " ✗"));
                    break;
                case "token":
                    appendAssistantDelta(data.delta || "");
                    break;
                case "assistant_message":
                    finalizeAssistantMessage(data.content || "");
                    break;
                case "error":
                    stopThinking();
                    appendProcessLine("error", data.message || "LLM 不可用，请稍后重试");
                    appendMessage("error", data.message || "LLM 不可用，请稍后重试");
                    break;
                case "done":
                    stopThinking();
                    break;
                default:
                    break;
            }
        }

        function resetTurnState() {
            stopThinking();
            currentProcessBox = null;
            currentAssistantEl = null;
            currentAssistantText = "";
        }

        function getProcessBox() {
            if (!currentProcessBox) {
                const messageArea = document.getElementById("messageArea");
                currentProcessBox = document.createElement("div");
                currentProcessBox.className = "process-box";
                messageArea.appendChild(currentProcessBox);
            }
            return currentProcessBox;
        }

        function appendProcessLine(kind, text) {
            const line = document.createElement("div");
            line.className = "process-line " + kind;
            line.textContent = text;
            getProcessBox().appendChild(line);
            scrollToBottom();
        }

        function startThinking() {
            if (thinkingTimer) return;
            thinkingSeconds = 0;
            thinkingLine = document.createElement("div");
            thinkingLine.className = "process-line thinking";
            thinkingLine.textContent = "Thinking - 0s";
            getProcessBox().appendChild(thinkingLine);
            thinkingTimer = setInterval(function() {
                thinkingSeconds += 1;
                if (thinkingLine) thinkingLine.textContent = "Thinking - " + thinkingSeconds + "s";
            }, 1000);
            scrollToBottom();
        }

        function updateThinking(seconds) {
            if (typeof seconds === "number" && seconds >= 0) {
                thinkingSeconds = seconds;
                if (thinkingLine) thinkingLine.textContent = "Thinking - " + thinkingSeconds + "s";
            }
        }

        function stopThinking(elapsedMs) {
            if (thinkingTimer) {
                clearInterval(thinkingTimer);
                thinkingTimer = null;
            }
            if (thinkingLine) {
                if (typeof elapsedMs === "number" && elapsedMs >= 0) {
                    thinkingSeconds = Math.max(thinkingSeconds, Math.round(elapsedMs / 1000));
                }
                thinkingLine.textContent = "Thinking - " + thinkingSeconds + "s";
                thinkingLine = null;
            }
        }

        function appendAssistantDelta(delta) {
            if (!delta) return;
            if (!currentAssistantEl) {
                getProcessBox();
                currentAssistantEl = document.createElement("div");
                currentAssistantEl.className = "message assistant";
                document.getElementById("messageArea").appendChild(currentAssistantEl);
            }
            currentAssistantText += delta;
            currentAssistantEl.innerHTML = renderAssistantMessage(currentAssistantText);
            scrollToBottom();
        }

        function finalizeAssistantMessage(content) {
            if (!content) return;
            if (!currentAssistantEl) {
                currentAssistantEl = document.createElement("div");
                currentAssistantEl.className = "message assistant";
                document.getElementById("messageArea").appendChild(currentAssistantEl);
            }
            currentAssistantText = content;
            currentAssistantEl.innerHTML = renderAssistantMessage(content);
            currentAssistantEl = null;
            scrollToBottom();
        }

        async function clearContext() {
            if (!confirm("确定清除所有对话记录？")) return;

            try {
                const response = await fetch("/api/chat/context", {
                    method: "DELETE",
                    credentials: "include"
                });
                if (response.ok) {
                    document.getElementById("messageArea").innerHTML = "";
                    appendMessage("system", "对话已清除");
                }
            } catch (e) {
                console.error("Failed to clear context:", e);
            }
        }

        function appendMessage(role, content) {
            const messageArea = document.getElementById("messageArea");
            const div = document.createElement("div");
            div.className = "message " + role;
            if (role === "assistant") {
                div.innerHTML = renderAssistantMessage(content);
            } else {
                div.textContent = content;
            }
            messageArea.appendChild(div);
            scrollToBottom();
        }

        function scrollToBottom() {
            const messageArea = document.getElementById("messageArea");
            setTimeout(() => {
                messageArea.scrollTop = messageArea.scrollHeight;
            }, 50);
        }

        function onInputKeydown(event) {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function autoResize(textarea) {
            textarea.style.height = "auto";
            textarea.style.height = Math.min(textarea.scrollHeight, 120) + "px";
        }
    </script>
</body>
</html>
