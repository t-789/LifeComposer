<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 对话测试</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            font-family: -apple-system, system-ui, sans-serif;
            background: #ededed;
        }

        .chat-container {
            max-width: 500px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #ededed;
        }

        .chat-header {
            background: #2E7D32;
            color: white;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: 500;
            flex-shrink: 0;
        }

        .clear-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.5);
            color: white;
            border-radius: 4px;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 12px;
        }

        .clear-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 75%;
            padding: 8px 12px;
            margin-bottom: 10px;
            word-break: break-word;
            line-height: 1.5;
            font-size: 15px;
            white-space: pre-wrap;
        }

        .message.user {
            background: #95EC69;
            color: #000;
            margin-left: auto;
            border-radius: 12px 4px 12px 12px;
        }

        .message.assistant {
            background: #FFFFFF;
            color: #333;
            margin-right: auto;
            border-radius: 4px 12px 12px 12px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.08);
        }

        .message.system {
            background: #FFF3E0;
            color: #E65100;
            margin: 0 auto 10px;
            text-align: center;
            font-size: 13px;
            border-radius: 8px;
            max-width: 90%;
        }

        .message.error {
            background: #FFCDD2;
            color: #C62828;
            margin-right: auto;
            border-radius: 4px 12px 12px 12px;
        }

        .chat-input-bar {
            background: #F8F8F8;
            padding: 8px 12px 12px;
            display: flex;
            gap: 8px;
            align-items: flex-end;
            border-top: 1px solid #E0E0E0;
            flex-shrink: 0;
        }

        textarea {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            font-family: inherit;
            font-size: 15px;
            padding: 8px 12px;
            border-radius: 20px;
            background: white;
            max-height: 120px;
            line-height: 1.4;
        }

        textarea:focus {
            box-shadow: 0 0 0 2px rgba(46,125,50,0.2);
        }

        .send-btn {
            background: #2E7D32;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 20px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
        }

        .send-btn:disabled {
            background: #A5D6A7;
            cursor: not-allowed;
        }

        .send-btn:hover:not(:disabled) {
            background: #1B5E20;
        }

        .loading-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
        }

        .loading-dot {
            width: 8px;
            height: 8px;
            background: #CCC;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .loading-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .message-time {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
            text-align: inherit;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <span>AI 对话测试</span>
            <button class="clear-btn" onclick="clearContext()">清除上下文</button>
        </div>
        <div class="chat-messages" id="messageArea">
        </div>
        <div class="chat-input-bar">
            <textarea id="messageInput" rows="1" placeholder="输入消息..."
                      onkeydown="onInputKeydown(event)" oninput="autoResize(this)"></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
    </div>
    <script>
        window.onload = function() {
            loadHistory();
        };

        async function loadHistory() {
            try {
                const response = await fetch('/api/chat/history', { credentials: 'include' });
                if (response.ok) {
                    const messages = await response.json();
                    for (const msg of messages) {
                        appendMessage(msg.role, msg.content);
                    }
                }
                scrollToBottom();
            } catch (e) {
                console.error('Failed to load history:', e);
            }
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            autoResize(input);
            appendMessage('user', text);

            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;

            const messageArea = document.getElementById('messageArea');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message assistant';
            loadingDiv.id = 'loadingIndicator';
            loadingDiv.innerHTML = '<div class="loading-indicator"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></div>';
            messageArea.appendChild(loadingDiv);
            scrollToBottom();

            try {
                const response = await fetch('/api/chat/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ message: text })
                });

                const loading = document.getElementById('loadingIndicator');
                if (loading) loading.remove();

                if (response.ok) {
                    const data = await response.json();
                    appendMessage('assistant', data.content);
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    appendMessage('error', errorData.error || '请求失败，请重试');
                }
            } catch (e) {
                const loading = document.getElementById('loadingIndicator');
                if (loading) loading.remove();
                appendMessage('error', '网络错误，请检查连接后重试');
            }

            sendBtn.disabled = false;
            scrollToBottom();
        }

        async function clearContext() {
            if (!confirm('确定清除所有对话记录？')) return;

            try {
                const response = await fetch('/api/chat/context', {
                    method: 'DELETE',
                    credentials: 'include'
                });
                if (response.ok) {
                    document.getElementById('messageArea').innerHTML = '';
                    appendMessage('system', '对话已清除');
                }
            } catch (e) {
                console.error('Failed to clear context:', e);
            }
        }

        function appendMessage(role, content) {
            const messageArea = document.getElementById('messageArea');
            const div = document.createElement('div');
            div.className = 'message ' + role;
            div.textContent = content;
            messageArea.appendChild(div);
            scrollToBottom();
        }

        function scrollToBottom() {
            const messageArea = document.getElementById('messageArea');
            setTimeout(() => {
                messageArea.scrollTop = messageArea.scrollHeight;
            }, 50);
        }

        function onInputKeydown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
        }
    </script>
</body>
</html>
