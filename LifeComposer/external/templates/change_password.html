<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>修改临时密码 - LifeComposer</title>
    <link rel="icon" href="/favicon.ico">
    <style>
        body { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f5f5; margin: 0; padding: 40px 16px; }
        .card { background: #fff; padding: 28px; border-radius: 8px; box-shadow: 0 0 12px rgba(0,0,0,.1); max-width: 420px; margin: 0 auto; }
        h1 { font-size: 18px; color: #333; margin: 0 0 6px; }
        p.hint { color: #6b7280; font-size: 13px; margin: 0 0 18px; }
        label { display: block; font-size: 13px; color: #374151; margin: 12px 0 4px; }
        input { width: 100%; box-sizing: border-box; padding: 9px 10px; border: 1px solid #dfe3e8; border-radius: 5px; font-size: 14px; }
        button { margin-top: 18px; width: 100%; padding: 10px; border: none; border-radius: 5px; background: #2563eb; color: #fff; font-size: 14px; cursor: pointer; }
        button:disabled { background: #93c5fd; cursor: not-allowed; }
        .alert { display: none; padding: 9px 11px; border-radius: 5px; font-size: 13px; margin-bottom: 12px; }
        .alert-danger { background: #fee2e2; color: #b91c1c; }
        .alert-success { background: #dcfce7; color: #15803d; }
        .meta { color: #6b7280; font-size: 12px; margin-top: 14px; }
        .meta a { color: #2563eb; }
    </style>
</head>
<body>
<div class="card">
    <h1>请设置新密码</h1>
    <p class="hint">管理员为你下发了临时密码。临时密码只能用于本次修改，完成后立即失效；未完成修改前无法使用其他功能。</p>

    <div id="msg" class="alert"></div>

    <form id="changeForm">
        <label for="currentPassword">当前临时密码</label>
        <input type="password" id="currentPassword" autocomplete="current-password" required>

        <label for="newPassword">新密码</label>
        <input type="password" id="newPassword" autocomplete="new-password" required>

        <label for="confirmPassword">再次输入新密码</label>
        <input type="password" id="confirmPassword" autocomplete="new-password" required>

        <button type="submit" id="submitBtn">提交新密码</button>
    </form>

    <div class="meta">
        <span id="expiry"></span>
        <span id="who"></span>
        <a href="#" id="logoutLink">退出登录</a>
    </div>
</div>

<script src="/csrf.js"></script>
<script>
    (function () {
        'use strict';

        var msgEl = document.getElementById('msg');
        var form = document.getElementById('changeForm');
        var submitBtn = document.getElementById('submitBtn');

        function showMsg(text, ok) {
            msgEl.textContent = text;
            msgEl.className = 'alert ' + (ok ? 'alert-success' : 'alert-danger');
            msgEl.style.display = 'block';
        }

        function loadContext() {
            fetch('/api/users/current', { credentials: 'include' })
                .then(function (resp) { return resp.ok ? resp.json() : null; })
                .then(function (user) {
                    if (!user) { return; }
                    document.getElementById('who').textContent = '当前账户：' + user.username + '　';
                })
                .catch(function () { /* context is optional */ });
        }

        function clearSecrets() {
            document.getElementById('currentPassword').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
        }

        document.getElementById('logoutLink').addEventListener('click', function (event) {
            event.preventDefault();
            clearSecrets();
            fetch('/api/users/logout', { method: 'POST', credentials: 'include' })
                .finally(function () { location.href = '/front/login'; });
        });

        form.addEventListener('submit', async function (event) {
            event.preventDefault();
            var currentPassword = document.getElementById('currentPassword').value;
            var newPassword = document.getElementById('newPassword').value;
            var confirmPassword = document.getElementById('confirmPassword').value;

            if (!newPassword) { showMsg('新密码不能为空', false); return; }
            if (newPassword !== confirmPassword) { showMsg('两次输入的新密码不一致', false); return; }
            if (newPassword === currentPassword) { showMsg('新密码不能与临时密码相同', false); return; }

            submitBtn.disabled = true;
            try {
                var resp = await fetch('/api/users/password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ currentPassword: currentPassword, newPassword: newPassword })
                });
                var data = await resp.json().catch(function () { return {}; });
                if (!resp.ok) {
                    showMsg(data.message || ('修改失败: ' + resp.status), false);
                    clearSecrets();
                    return;
                }
                clearSecrets();
                showMsg('密码已更新，正在跳转…', true);
                var current = await fetch('/api/users/current', { credentials: 'include' })
                    .then(function (r) { return r.ok ? r.json() : null; })
                    .catch(function () { return null; });
                location.href = (current && current.type === 2) ? '/admin' : '/';
            } catch (err) {
                showMsg('修改请求失败: ' + err.message, false);
            } finally {
                submitBtn.disabled = false;
            }
        });

        loadContext();
    })();
</script>
</body>
</html>
