spring.application.name=LifeComposer
# transaction_mode=immediate: Spring-managed write transactions (last-admin
# guards, password changes) take SQLite's write lock up front instead of
# upgrading from a shared lock, so "read count then update" is serialized.
spring.datasource.url=jdbc:sqlite:data.db?busy_timeout=5000&transaction_mode=immediate
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.whitelabel.enabled=false

server.port=18000

logging.level.web = INFO
spring.devtools.add-properties = true

spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

spring.web.resources.add-mappings=true
spring.web.resources.static-locations=file:./external/static/
spring.thymeleaf.prefix=file:./external/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# ---------------------------------------------------------------------------
# Milestone 5: session cookie hardening + CSRF + AI usage controls
# ---------------------------------------------------------------------------
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# The final entry is a wildcard subdomain pattern for temporary Cloudflare Quick
# Tunnels (https://<random-words>.trycloudflare.com), used to point a frontend
# dev server at this backend during debugging. It is intentionally limited to
# that one host suffix; drop it for anything beyond local development.
app.security.allowed-origins=http://localhost:*,http://127.0.0.1:*,https://localhost:*,https://*.trycloudflare.com
app.security.csrf-cookie-secure=${CSRF_COOKIE_SECURE:false}
app.security.chat-per-minute=5
app.security.chat-per-day=100
app.security.chat-max-output-tokens=1024
app.security.sse-timeout-millis=300000
app.security.register-per-minute-per-ip=10
app.security.login-max-failures=5
app.security.login-lock-millis=900000
app.security.admin-intranet-only=false
app.security.chat-usage-zone=Asia/Shanghai
app.security.chat-usage-retention-days=30

# ---------------------------------------------------------------------------
# Milestone 6: administrator bootstrap and password strength.
# The initial admin password is ONLY read from the environment variable below.
# Never put a real password in this file; it stays empty in version control.
# Missing/weak values make a database without administrators fail to start.
# ---------------------------------------------------------------------------
lifecomposer.admin.initial-password=${LIFECOMPOSER_INITIAL_ADMIN_PASSWORD:}
lifecomposer.admin.min-password-length=12
lifecomposer.admin.max-password-length=72
# Non-administrators replacing an administrator-issued temporary password.
lifecomposer.admin.user-min-password-length=8
# Temporary password lifetime; after it the account cannot log in until an
# administrator issues a new temporary password.
lifecomposer.admin.temp-password-ttl-minutes=1440

# ---------------------------------------------------------------------------
# Milestone 7: admin debug console (all /api/admin/** and /admin/** are ADMIN-only).
# Read-only, server-side paged, whitelisted filters/sorting, rate limited.
# ---------------------------------------------------------------------------
lifecomposer.admin.console-default-page-size=50
lifecomposer.admin.console-max-page-size=200
lifecomposer.admin.console-queries-per-minute=240
lifecomposer.admin.console-query-timeout-seconds=10
lifecomposer.admin.console-preview-length=300
lifecomposer.admin.console-diagnostic-length=4000

# ---------------------------------------------------------------------------
# Embedding (local Ollama, independent from generative LLM)
# Fixed endpoint: POST {embedding.baseUrl}/embeddings; response data[0].embedding
# ---------------------------------------------------------------------------
embedding.enabled=true
embedding.baseUrl=http://localhost:11434/v1
embedding.model=quentinz/bge-small-zh-v1.5:f16
embedding.timeoutMillis=30000

# ---------------------------------------------------------------------------
# RAG retrieval defaults (v0.0.4)
# ---------------------------------------------------------------------------
rag.defaultTopK=5
rag.maxTopK=20
rag.minSimilarity=0.2

# ---------------------------------------------------------------------------
# Generative LLM use cases: unified deepseek-flash defaults.
# enabled=false keeps a clean clone bootable without a cloud key; run.sh
# enables qa/chat by default. /api/chat/* never falls back to mock content.
# API keys are read from the env var named by apiKeyEnv and are never logged.
# ---------------------------------------------------------------------------
llm.useCases.qa.provider=deepseek
llm.useCases.qa.baseUrl=https://api.deepseek.com/v1
llm.useCases.qa.model=deepseek-flash
llm.useCases.qa.apiKeyEnv=DEEPSEEK_API_KEY
llm.useCases.qa.enabled=false
llm.useCases.qa.timeoutMillis=60000

llm.useCases.planning.provider=deepseek
llm.useCases.planning.baseUrl=https://api.deepseek.com/v1
llm.useCases.planning.model=deepseek-flash
llm.useCases.planning.apiKeyEnv=DEEPSEEK_API_KEY
llm.useCases.planning.enabled=false
llm.useCases.planning.timeoutMillis=60000

llm.useCases.profile.provider=deepseek
llm.useCases.profile.baseUrl=https://api.deepseek.com/v1
llm.useCases.profile.model=deepseek-flash
llm.useCases.profile.apiKeyEnv=DEEPSEEK_API_KEY
llm.useCases.profile.enabled=false
llm.useCases.profile.timeoutMillis=60000

llm.useCases.sql.provider=deepseek
llm.useCases.sql.baseUrl=https://api.deepseek.com/v1
llm.useCases.sql.model=deepseek-flash
llm.useCases.sql.apiKeyEnv=DEEPSEEK_API_KEY
llm.useCases.sql.enabled=false
llm.useCases.sql.timeoutMillis=60000

llm.useCases.chat.provider=deepseek
llm.useCases.chat.baseUrl=https://api.deepseek.com/v1
llm.useCases.chat.model=deepseek-flash
llm.useCases.chat.apiKeyEnv=DEEPSEEK_API_KEY
llm.useCases.chat.enabled=false
llm.useCases.chat.timeoutMillis=60000
