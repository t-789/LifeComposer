spring.application.name=LifeComposer
spring.datasource.url=jdbc:sqlite:data.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.whitelabel.enabled=false

server.port=18000

logging.level.web = INFO
spring.devtools.add-properties = true

spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

spring.web.resources.add-mappings=true
spring.web.resources.static-locations=file:./external/static/
spring.thymeleaf.prefix=file:./external/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# LLM per-use-case configuration
# Default: local Ollama, disabled. Set enabled=true and api-key-env to use.
llm.useCases.qa.provider=ollama
llm.useCases.qa.baseUrl=http://localhost:11434/v1
llm.useCases.qa.model=lfm2.5:8b
llm.useCases.qa.enabled=false
llm.useCases.qa.timeoutMillis=30000

llm.useCases.planning.provider=ollama
llm.useCases.planning.baseUrl=http://localhost:11434/v1
llm.useCases.planning.model=lfm2.5:8b
llm.useCases.planning.enabled=false
llm.useCases.planning.timeoutMillis=30000

llm.useCases.profile.provider=ollama
llm.useCases.profile.baseUrl=http://localhost:11434/v1
llm.useCases.profile.model=lfm2.5:8b
llm.useCases.profile.enabled=false
llm.useCases.profile.timeoutMillis=30000

llm.useCases.sql.provider=ollama
llm.useCases.sql.baseUrl=http://localhost:11434/v1
llm.useCases.sql.model=lfm2.5:8b
llm.useCases.sql.enabled=false
llm.useCases.sql.timeoutMillis=30000

llm.useCases.chat.provider=ollama
llm.useCases.chat.baseUrl=http://localhost:11434/v1
llm.useCases.chat.model=lfm2.5:8b
llm.useCases.chat.enabled=true
llm.useCases.chat.timeoutMillis=30000