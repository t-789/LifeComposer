spring.datasource.url=jdbc:sqlite:target/test-data.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=false

server.port=0

spring.web.resources.add-mappings=false
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.whitelabel.enabled=false

logging.level.web=WARN
logging.level.org.springframework.security=WARN

spring.devtools.add-properties=false

# LLM config for tests - keep defaults (disabled, no Ollama needed)

llm.useCases.chat.provider=ollama
llm.useCases.chat.baseUrl=http://localhost:11434/v1
llm.useCases.chat.model=lfm2.5:8b
llm.useCases.chat.enabled=false
llm.useCases.chat.timeoutMillis=30000
