spring.datasource.url=jdbc:sqlite:target/test-data.db?busy_timeout=5000&transaction_mode=immediate
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Resolve the real page templates so /admin page routes can be asserted end to end
# (surefire runs with the project directory as working directory).
spring.thymeleaf.prefix=file:./external/templates/
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=false

server.port=0

spring.web.resources.add-mappings=false
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.whitelabel.enabled=false

logging.level.web=WARN
logging.level.org.springframework.security=WARN

spring.devtools.add-properties=false

# Milestone 5 test defaults: high auth limits so unrelated tests do not trip them.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false

app.security.allowed-origins=http://localhost:*,http://127.0.0.1:*,https://localhost:*
app.security.csrf-cookie-secure=false
app.security.chat-per-minute=5
app.security.chat-per-day=100
app.security.chat-max-output-tokens=1024
app.security.sse-timeout-millis=300000
app.security.register-per-minute-per-ip=1000
app.security.login-max-failures=1000
app.security.login-lock-millis=1000
app.security.admin-intranet-only=false
app.security.chat-usage-zone=Asia/Shanghai
app.security.chat-usage-retention-days=30

# Milestone 6/7: the test environment explicitly provides a test-only initial
# administrator password so the production fail-fast bootstrap rule is kept
# identical here. It is only ever written to target/test-data.db.
lifecomposer.admin.initial-password=TestOnlyInitPassw0rd!2026
lifecomposer.admin.min-password-length=12
lifecomposer.admin.max-password-length=72
lifecomposer.admin.user-min-password-length=8
lifecomposer.admin.temp-password-ttl-minutes=1440
lifecomposer.admin.console-default-page-size=50
lifecomposer.admin.console-max-page-size=200
lifecomposer.admin.console-queries-per-minute=100000
lifecomposer.admin.console-query-timeout-seconds=10
lifecomposer.admin.console-preview-length=300

# Embedding must stay off in tests (no Ollama dependency); RAG tests mock the client.
lifecomposer.recommendation.scoring-version=experimental-v1
lifecomposer.recommendation.skill-weight=0.40
lifecomposer.recommendation.time-weight=0.20
lifecomposer.recommendation.goal-weight=0.20
lifecomposer.recommendation.difficulty-weight=0.10
lifecomposer.recommendation.preparation-weight=0.10
lifecomposer.recommendation.suitable-threshold=0.70
lifecomposer.recommendation.partial-threshold=0.45

embedding.enabled=false
embedding.baseUrl=http://localhost:11434/v1
embedding.model=quentinz/bge-small-zh-v1.5:f16

rag.defaultTopK=5
rag.maxTopK=20
rag.minSimilarity=0.2

# LLM config for tests - deepseek-flash defaults, all disabled (no network).
llm.useCases.qa.provider=deepseek
llm.useCases.qa.baseUrl=https://api.deepseek.com/v1
llm.useCases.qa.model=deepseek-flash
llm.useCases.qa.apiKeyEnv=DEEPSEEK_API_KEY
llm.useCases.qa.enabled=false
llm.useCases.qa.timeoutMillis=30000

llm.useCases.planning.provider=deepseek
llm.useCases.planning.baseUrl=https://api.deepseek.com/v1
llm.useCases.planning.model=deepseek-flash
llm.useCases.planning.apiKeyEnv=DEEPSEEK_API_KEY
llm.useCases.planning.enabled=false
llm.useCases.planning.timeoutMillis=30000

llm.useCases.profile.provider=deepseek
llm.useCases.profile.baseUrl=https://api.deepseek.com/v1
llm.useCases.profile.model=deepseek-flash
llm.useCases.profile.apiKeyEnv=DEEPSEEK_API_KEY
llm.useCases.profile.enabled=false
llm.useCases.profile.timeoutMillis=30000

llm.useCases.sql.provider=deepseek
llm.useCases.sql.baseUrl=https://api.deepseek.com/v1
llm.useCases.sql.model=deepseek-flash
llm.useCases.sql.apiKeyEnv=DEEPSEEK_API_KEY
llm.useCases.sql.enabled=false
llm.useCases.sql.timeoutMillis=30000

llm.useCases.chat.provider=deepseek
llm.useCases.chat.baseUrl=https://api.deepseek.com/v1
llm.useCases.chat.model=deepseek-flash
llm.useCases.chat.apiKeyEnv=DEEPSEEK_API_KEY
llm.useCases.chat.enabled=false
llm.useCases.chat.timeoutMillis=30000
